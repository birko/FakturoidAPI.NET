name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Publishing a GitHub release with tag X.Y.Z (or vX.Y.Z) publishes version X.Y.Z to GitHub Packages
  # (not to nuget.org yet).
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Release 1.2.3 (or v1.2.3) builds and publishes version 1.2.3 (assembly, file and package version);
      # other builds use <Version> from Fakturoid.csproj.
      - name: Version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "VERSION_ARG=-p:Version=${TAG#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Fakturoid.slnx

      - name: Build
        run: dotnet build Fakturoid.slnx --configuration Release --no-restore $VERSION_ARG

      # Offline tests only: live tests are skipped unless FAKTUROID_LIVE=1 (credentials in ~/.fakturoid-test.env).
      - name: Test
        run: dotnet test Fakturoid.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack Fakturoid/Fakturoid.csproj --configuration Release --no-build --output out $VERSION_ARG

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: out/*.nupkg

  # GitHub Packages (https://nuget.pkg.github.com/<owner>/index.json) with the workflow's GITHUB_TOKEN, no stored key.
  # The package is linked to this repository through RepositoryUrl in Fakturoid.csproj.
  # Consumers add the source with a personal access token that has read:packages.
  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the .nupkg to the release
      packages: write   # push to GitHub Packages

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: out

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Push package to GitHub Packages
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate

      - name: Attach package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" out/*.nupkg --repo "$GITHUB_REPOSITORY" --clobber
