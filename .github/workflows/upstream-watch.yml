name: Upstream watch

# Daily check of the Fakturoid API changelog (https://www.fakturoid.cz/api/v3/changelog) and the official
# PHP and Ruby clients. A new changelog entry or a new commit in a client repository opens an issue
# (label "upstream-change"); GitHub notifies watchers of the repository about the issue.
# Optionally the issue is assigned to the Copilot coding agent (secret COPILOT_ASSIGN_TOKEN).

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check upstream
        run: |
          set -euo pipefail
          gh label create upstream-change --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "Change in the Fakturoid API changelog or an official client" --force >/dev/null

          what_to_do=$(cat <<'EOF'
          ### What to do
          - Find API changes: new or removed endpoints, attributes, value list items, query parameters, changed types or defaults.
          - Compare them with the library in `FakturoidAPI.NET/` (request models, response models, filters, `ValueLists/Constants.cs`)
            and with the API reference page of the resource (https://www.fakturoid.cz/api/v3).
          - For every change add or adjust an offline test in `Fakturoid.Tests/` first (copy the documented JSON into `TestData`), then the model.
          - A resource the library does not cover yet (see "Not covered yet" in README.md) needs no change; say so.
          - Follow `.github/copilot-instructions.md`. If nothing affects the library, say so and close the issue.
          EOF
          )

          # Last processed value of a source, stored as a marker in the newest issue of that source.
          last_marker() {
            gh issue list --repo "$GITHUB_REPOSITORY" --label upstream-change --state all --limit 100 --json body \
              --jq "[.[].body | capture(\"<!-- upstream:${1}@(?<v>[^ ]+) -->\") | .v][0] // empty"
          }

          create_issue() {
            local title="$1" body="$2" url
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --label upstream-change --title "$title" --body "$body")
            echo "created $url"
            if [ -n "${COPILOT_ASSIGN_TOKEN:-}" ]; then
              GH_TOKEN="$COPILOT_ASSIGN_TOKEN" gh issue edit "$url" --add-assignee "@copilot" \
                || echo "::warning::Could not assign $url to Copilot (coding agent enabled? token scope?)"
            fi
          }

          # 1) API changelog: entries are dated <h2 id="october-26-2026"> sections, newest first.
          #    Argument: id of the newest entry already reviewed when this workflow was added.
          check_changelog() {
            local baseline="$1" page entries newest last base new count body
            page=$(curl -fsSL --retry 3 -A "FakturoidAPI.NET upstream watch (github.com/$GITHUB_REPOSITORY)" https://www.fakturoid.cz/api/v3/changelog)
            entries=$(echo "$page" | python3 .github/scripts/changelog_entries.py)
            count=$(echo "$entries" | jq 'length')
            if [ "$count" -eq 0 ]; then
              echo "::error::No entries found on the changelog page; the page layout changed, update .github/scripts/changelog_entries.py"
              exit 1
            fi
            newest=$(echo "$entries" | jq -r '.[0].id')
            last=$(last_marker changelog)
            base="${last:-$baseline}"
            if [ "$newest" = "$base" ]; then
              echo "changelog: no new entry since $base"
              return
            fi
            if ! echo "$entries" | jq -e --arg base "$base" 'any(.[]; .id == $base)' >/dev/null; then
              echo "::warning::Changelog entry $base is no longer on the page; reporting the 5 newest entries"
              new=$(echo "$entries" | jq '.[0:5]')
            else
              # The entries above the last reviewed one.
              new=$(echo "$entries" | jq --arg base "$base" '(map(.id) | index($base)) as $i | .[0:$i]')
            fi
            body=$(cat <<EOF
          <!-- upstream:changelog@${newest} -->
          New entries in the [Fakturoid API changelog](https://www.fakturoid.cz/api/v3/changelog) since \`${base}\`:

          $(echo "$new" | jq -r '.[] | "### [\(.title)](https://www.fakturoid.cz/api/v3/changelog#\(.id))\n\(.text)\n"')

          $what_to_do
          EOF
            )
            echo "changelog: $base -> $newest"
            create_issue "API changelog: $(echo "$entries" | jq -r '.[0].title')" "$body"
          }

          # 2) Official clients: new commits since the last processed one.
          #    Arguments: repository, commit already reviewed when this workflow was added.
          check_repo() {
            local repo="$1" baseline="$2" head last base compare commits files body
            head=$(gh api "repos/$repo/commits?per_page=1" --jq '.[0].sha')
            last=$(last_marker "$repo")
            base="${last:-$baseline}"
            if [ "$head" = "$base" ]; then
              echo "$repo: no change since ${base:0:7}"
              return
            fi
            compare=$(gh api "repos/$repo/compare/$base...$head")
            commits=$(echo "$compare" | jq -r '.commits[] | "- [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0])"')
            files=$(echo "$compare" | jq -r '.files[]? | "- `\(.filename)` (+\(.additions) -\(.deletions))"')
            body=$(cat <<EOF
          <!-- upstream:${repo}@${head} -->
          New commits in the official client [\`$repo\`](https://github.com/$repo): [compare ${base:0:7}...${head:0:7}](https://github.com/$repo/compare/$base...$head)

          ### Commits
          $commits

          ### Changed files
          $files

          $what_to_do
          EOF
            )
            echo "$repo: ${base:0:7} -> ${head:0:7}"
            create_issue "Upstream change: $repo (${head:0:7})" "$body"
          }

          check_changelog october-26-2026
          check_repo fakturoid/fakturoid-php de08c0edd59750243d41e3a6bcce3675eecc6df7
          check_repo fakturoid/fakturoid-ruby 84b511f9422f7f0e4b6c2dcbbf01cde0295d2aca
